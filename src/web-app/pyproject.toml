[project]
name = "call-center-tester"
version = "0.1.0"
description = "Debug/showcase web app for the Foundry hosted call-center agents (text + Voice Live, with live traces)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "azure-ai-voicelive[aiohttp]==1.2.0b5",
    "azure-identity>=1.19",
    "aiohttp>=3.10",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[[tool.uv.index]]
name = "msiopypi"
url = "https://pkgs.dev.azure.com/ms-feed-12/1es-public/_packaging/pypi-public/pypi/simple/"
default = true
